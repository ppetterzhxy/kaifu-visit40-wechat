<header class="mast"><div class="wrap"><div class="eyebrow">FIELD NOTES / 松江门店拜访</div><div class="headrow"><div><h1>从凯富出发</h1><p>四组各10家 · 电话、地址、路线</p></div><div class="stamp"><strong>40</strong>家门店</div></div></div></header>
<div class="sticky"><div class="wrap"><div class="tabs" role="tablist" aria-label="选择拜访组"><button role="tab" data-group="1" aria-selected="false">第1组</button><button role="tab" data-group="2" aria-selected="false">第2组</button><button role="tab" data-group="3" aria-selected="false">第3组</button><button role="tab" data-group="4" aria-selected="false">第4组</button></div><div class="progressline"><span id="progressText">已拜访 0 / 10</span><span>进度仅保存在本机</span></div><div class="track"><div id="progressBar"></div></div></div></div>
<main class="main wrap"><div class="teamtop"><div><h2 id="teamTitle"></h2><p id="teamMetrics"></p></div><button class="copylink" id="share">复制本组链接</button></div><input id="search" class="search" type="search" placeholder="搜索店名、地址或电话" aria-label="搜索本组门店"><div class="notice">在微信内点「查看路线」进入地图网页，不强制跳浏览器。需要语音导航时，可按地图提示打开App。同商场建议集中停车后步行拜访。</div><div id="stores"></div><a id="return" class="return">返回凯富科技园 ↗</a><p class="foot">起点：上海市松江区泗泾镇高技路205弄。<br>电话号码来自地图，未拨测；出发前请确认营业、地址和负责人。分组进度为本机记录，不会同步给其他人。转发可使用微信右上角「…」。</p></main>
<div class="dock"><div class="dockin"><span id="dockText"></span><button class="next" id="next">下一家未拜访 ↓</button></div></div><div id="toast" class="toast" role="status" hidden></div>
<div class="overlay" id="phoneModal" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="phoneTitle"><h2 id="phoneTitle">选择拨打号码</h2><p class="meta">点击号码将打开系统拨号界面。</p><div id="phoneNumbers"></div><button class="close" id="closeModal">取消</button></div></div>
